[tools]
opencode = "latest"
agy = "latest"
"forgejo:gitea/gitea-mcp" = { version = "latest", api_url = "https://gitea.com/api/v1" }
[settings]
disable_tools = ["claude"]
[dotfiles]
"~/.config/opencode/opencode.json/org" = { source = "plugin-org-mcp-server-opencode.json", merge = true, format = "json" }
"~/.config/opencode/opencode.json/mcp" = { source = "opencode/mcp-git.json", merge = true, format = "json" }
"~/.gemini/config/mcp_config.json/mcp" = { source = "agy/mcp.json", merge = "missing", format = "json", template = "tera", permissions = "0600" }
