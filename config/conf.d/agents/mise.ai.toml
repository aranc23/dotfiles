[tools]
opencode = "latest"
agy = "latest"
"forgejo:gitea/gitea-mcp" = { version = "latest", api_url = "https://gitea.com/api/v1" }
[settings]
disable_tools = ["claude"]
[dotfiles]
"~/.config/opencode/opencode.json/org" = { source = "plugin-org-mcp-server-opencode.json", merge = true, format = "json" }
"~/.config/opencode/opencode.json/mcp" = { source = "opencode/mcp-git.json", merge = true, format = "json" }
"~/.config/opencode/opencode.json/formatter" = { source = "opencode/formatter.json", merge = true, format = "json" }
"~/.config/opencode/opencode.json/lsp" = { source = "opencode/lsp.json", merge = true, format = "json" }
"~/.config/opencode/opencode.json/provider" = { source = "~/llama/{%= hostname %}/opencode.json", merge = true, format = "json" }
"~/.gemini/config/mcp_config.json/mcp" = { source = "agy/mcp.json", merge = true, format = "json", template = "tera"}
"~/.config/mise/conf.d/git.local.toml/seed" = { source = "templates/private.toml", template = "tera", merge = "missing" }
[bootstrap.secrets]
gitlab_personal_access_token = "GITLAB_PERSONAL_ACCESS_TOKEN"
gitea_host = "GITEA_HOST"
gitea_access_token = "GITEA_ACCESS_TOKEN"
github_pat = "GITHUB_PAT"
