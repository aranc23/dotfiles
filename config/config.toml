[settings]
idiomatic_version_file_enable_tools = ["ruby"]
age.key_file = "~/.config/mise/age.txt"
[settings.history]
allow_plaintext_history = true
[bootstrap.services.mise-history]
builtin = "history-watch"
[tools]
age = "latest"
chezmoi = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
oh-my-posh = "32.0.0"
rclone = "latest"
restic = "latest"
rg = "latest"
tmux = "latest"
uv = "latest"
yq = "latest"
zellij = "latest"
zoxide = "latest"
rust = "latest"
python = "3"
node = "latest"
"npm:mcp-remote" = "latest"

[[tools.ruby]]
  version = "3"
  auto_update = true

[dotfiles]
"~/.bao" = { mode = "track" }
"~/.bash_logout" = { mode = "track" }
"~/.bash_profile" = { mode = "track" }
"~/.bashrc" = { mode = "track" }
"~/.config/kitty/kitty.conf" = { mode = "track" }
"~/.config/mise" = { mode = "track" }
"~/.config/zellij/config.kdl" = { mode = "track" }
"~/.gitconfig/base" = { source = "dotfiles/.gitconfig", merge = true, format = "ini", template = "tera" }
"~/.muttrc" = { mode = "track" }
"~/.notmuch-config" = { mode = "track" }
"~/.perltidyrc" = { mode = "track" }
"~/.poshthemes/tokyo.omp.json" = { mode = "track" }
"~/.tmux.conf" = { mode = "track" }
"~/bin/diskuser" = { mode = "track" }
"~/bin/docker-volume-dump" = { mode = "track" }
"~/bin/git-prompt.sh" = { mode = "track" }
"~/bin/keychaintmux" = { mode = "track" }
"~/bin/keyctl-token-helper" = { mode = "track", encrypt = false, allow_plaintext = true }
"~/bin/lxc-exporter" = { mode = "track" }
"~/bin/lxc-mover" = { mode = "track" }
"~/bin/lxc-snapper" = { mode = "track" }
"~/bin/privoxy.env" = { mode = "track" }
"~/bin/rekey.rb" = { mode = "track" }
"~/bin/start-puppet-editor-services" = { mode = "track" }

[history]
exclude = ["**/*.swp", "**/*~", "**/#*#", "**/.#*", "~/.config/mise/config.local.toml", "~/.config/mise/*.local.toml", "/home/spin/.mise/config/age.txt"]
[history.encryption]
recipients = ["age1tag1qtzl736p8xvckz8rueymfzrcgm0zsxtxs7fswn3y8c294tqgx7022hvzyd7","age1tag1q2wwqy2zkxzahxl0q9ypxzcta8pja62wutqvfrwjptn98k6f5d5sv830r3t","age1kcg2k2gua490zf34p9kqhpry9ln9xjgsmrafxcjthg063jg8dycs9sdqun"]

