# managed by chezmoi or some other dotfiles organizer

set -gw mode-keys emacs

# window title magic
set -g set-titles on
set -g set-titles-string '#h - #S - #I - #P - #T'
# change me some day:
set -g default-terminal "screen-256color"

set-option -g history-limit 10000


# mouse mode
bind M set-option -g mouse on \; \
display 'Mouse: ON'

bind N set-option -g mouse off \; \
display 'Mouse: OFF'

# move x clipboard into tmux paste buffer
bind C-p run "tmux set-buffer \"$(xclip -o)\"; tmux paste-buffer"
# move tmux copy buffer into x clipboard
bind C-y run "tmux show-buffer | xclip -i"

# time is stupid, choose-tree is awesome
bind t choose-tree

new-session -d -s main
#new-session -d -s shells
new-session -d -s works
new-session -d -s storage
#new-session -d -s enchantress
new-session -d -s services
#new-session -d -s personal
new-session -d -s mon

new-window -n top -d -t mon 'top'
new-window -n zpool-iostat -d -t mon 'zpool iostat -v 15'
new-window -n iostat -d -t mon 'cd /dev ; iostat -x sd? nvme?n? 5'
#new-window -n offlineimap -d -t mon 'offlineimap'

# make joining easier?  I do not know what these do or how they differ
# from the defaults:
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

# how is this better than regular zoom???
unbind +
bind + \
  new-window -d -n tmux-zoom 'clear && echo TMUX ZOOM && read' \;\
  swap-pane -s tmux-zoom.0 \;\
  select-window -t tmux-zoom
    
unbind -
bind - \
  last-window \;\
  swap-pane -s tmux-zoom.0 \;\
  kill-window -t tmux-zoom
